[package]
name = "gold-label-studio-pro"
version = "0.2.0"
description = "Gold Label Studio Pro"
authors = ["AmirNourhan"]
edition = "2021"

[lib]
name = "gold_label_studio_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"