name: React Tauri Dashboard CI
on:
  push:
    branches:
      [
        main,
        react-tauri-dashboard,
        persistence-foundation,
        catalog-form-integration,
        product-repository-integration,
        label-template-integration,
        packaging-persistence-integration,
        returns-persistence-integration,
        settings-persistence-integration,
        users-auth-integration,
        feature-integration-v1,
        final-functional-integration,
        final-audit-release,
        acceptance-fix-v0.2.2,
        label-designer-repair-v0.2.3,
      ]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Frontend tests
        run: npm run test:run

      - name: Frontend production build
        run: npm run build

      - name: Assert production bundle excludes visual-test harness
        shell: powershell
        run: |
          $matches = Get-ChildItem "dist\assets\*.js" | Select-String -Pattern "GLSP-VISUAL|قالب بررسی تصویری"
          if ($matches) { throw "Production frontend contains the Label Designer visual-test harness" }

      - name: Validate Tauri window permissions
        shell: powershell
        run: |
          $cap = Get-Content "src-tauri/capabilities/default.json" -Raw | ConvertFrom-Json
          $required = @(
            "core:window:allow-close",
            "core:window:allow-minimize",
            "core:window:allow-toggle-maximize",
            "core:window:allow-start-dragging",
            "core:window:allow-current-monitor",
            "core:window:allow-unmaximize",
            "core:window:allow-set-min-size",
            "core:window:allow-set-size",
            "core:window:allow-center"
          )
          foreach ($permission in $required) {
            if ($cap.permissions -notcontains $permission) {
              throw "Missing required Tauri permission: $permission"
            }
          }

      - name: Capture visual checks
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path visual-checks | Out-Null
          $server = Start-Process -FilePath "cmd.exe" -ArgumentList "/c","npm run preview -- --host 127.0.0.1 --port 4173" -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 45; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:4173" -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "Vite preview did not become ready" }

            $edge = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
            if (!(Test-Path $edge)) { $edge = "C:\Program Files\Microsoft\Edge\Application\msedge.exe" }
            if (!(Test-Path $edge)) { throw "Microsoft Edge executable not found" }

            $checks = @(
              @{ Name = "dashboard-1366x768"; Page = "dashboard"; Size = "1366,768" },
              @{ Name = "dashboard-1440x900"; Page = "dashboard"; Size = "1440,900" },
              @{ Name = "dashboard-1448x1086"; Page = "dashboard"; Size = "1448,1086" },
              @{ Name = "dashboard-1536x864"; Page = "dashboard"; Size = "1536,864" },
              @{ Name = "dashboard-1600x900"; Page = "dashboard"; Size = "1600,900" },
              @{ Name = "dashboard-1920x1080"; Page = "dashboard"; Size = "1920,1080" },
              @{ Name = "returns-1366x768"; Page = "returns"; Size = "1366,768" },
              @{ Name = "returns-1440x900"; Page = "returns"; Size = "1440,900" },
              @{ Name = "returns-1448x1086"; Page = "returns"; Size = "1448,1086" },
              @{ Name = "returns-1536x864"; Page = "returns"; Size = "1536,864" },
              @{ Name = "returns-1600x900"; Page = "returns"; Size = "1600,900" },
              @{ Name = "returns-1920x1080"; Page = "returns"; Size = "1920,1080" },
              @{ Name = "packaging-1366x768"; Page = "packaging"; Size = "1366,768" },
              @{ Name = "packaging-1440x900"; Page = "packaging"; Size = "1440,900" },
              @{ Name = "packaging-1448x1086"; Page = "packaging"; Size = "1448,1086" },
              @{ Name = "packaging-1536x864"; Page = "packaging"; Size = "1536,864" },
              @{ Name = "packaging-1600x900"; Page = "packaging"; Size = "1600,900" },
              @{ Name = "packaging-1920x1080"; Page = "packaging"; Size = "1920,1080" },
              @{ Name = "settings-1366x768"; Page = "settings"; Size = "1366,768" },
              @{ Name = "settings-1440x900"; Page = "settings"; Size = "1440,900" },
              @{ Name = "settings-1536x864"; Page = "settings"; Size = "1536,864" },
              @{ Name = "settings-1600x900"; Page = "settings"; Size = "1600,900" },
              @{ Name = "settings-1920x1080"; Page = "settings"; Size = "1920,1080" },
              @{ Name = "products-1366x768"; Page = "products"; Size = "1366,768" },
              @{ Name = "products-1440x900"; Page = "products"; Size = "1440,900" },
              @{ Name = "products-1536x864"; Page = "products"; Size = "1536,864" },
              @{ Name = "products-1600x900"; Page = "products"; Size = "1600,900" },
              @{ Name = "products-1920x1080"; Page = "products"; Size = "1920,1080" }
            )
            foreach ($check in $checks) {
              $output = "$pwd\visual-checks\$($check.Name).png"
              $url = "http://127.0.0.1:4173/?page=$($check.Page)"
              & $edge --headless --disable-gpu --hide-scrollbars --window-size=$($check.Size) --screenshot="$output" $url | Out-Null
              for ($wait = 0; $wait -lt 30 -and !(Test-Path $output); $wait++) {
                Start-Sleep -Milliseconds 500
              }
              if (!(Test-Path $output)) { throw "Visual check was not created: $($check.Name)" }
            }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: Capture real Label Designer visual checks
        shell: powershell
        env:
          VITE_VISUAL_TEST_MODE: "1"
        run: |
          npm run build
          $server = Start-Process -FilePath "cmd.exe" -ArgumentList "/c","npm run preview -- --host 127.0.0.1 --port 4173" -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 45; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:4173" -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "Vite visual-test preview did not become ready" }

            $edge = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
            if (!(Test-Path $edge)) { $edge = "C:\Program Files\Microsoft\Edge\Application\msedge.exe" }
            if (!(Test-Path $edge)) { throw "Microsoft Edge executable not found" }

            $sizes = @("1366,768", "1440,900", "1448,1086", "1536,864", "1600,900", "1920,1080")
            foreach ($size in $sizes) {
              $name = "label-designer-$($size.Replace(',', 'x'))"
              npm run visual:capture -- --url "http://127.0.0.1:4173/?page=label-designer" --size $size --output "$pwd\visual-checks\$name.png" --browser $edge
              if ($LASTEXITCODE -ne 0) { throw "Label Designer visual check failed: $name" }
            }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: Upload visual checks
        uses: actions/upload-artifact@v4
        with:
          name: Gold-Label-Studio-Pro-Visual-Checks
          path: visual-checks/*.png

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Tauri Windows acceptance build + NSIS installer
        env:
          VITE_ACCEPTANCE_MODE: "1"
        run: npm run tauri build -- --bundles nsis --features acceptance-harness

      - name: Assert the release executable is a Windows GUI application
        shell: powershell
        run: |
          $exe = "src-tauri\target\release\gold-label-studio-pro.exe"
          if (!(Test-Path $exe)) { throw "Executable not found: $exe" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          if ([System.Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4) -ne "PE$([char]0)$([char]0)") {
            throw "Not a PE executable: $exe"
          }
          # Subsystem lives in the optional header: 2 = Windows GUI, 3 = console.
          # A console subsystem binary opens a CMD window behind the app, and
          # closing that window terminates the application.
          $subsystem = [System.BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          Write-Host "Release executable subsystem: $subsystem (2 = GUI)"
          if ($subsystem -ne 2) {
            throw "The release executable is not built as a Windows GUI application (subsystem $subsystem)"
          }

      - name: Verify the database initialises on a clean machine
        shell: powershell
        run: |
          $exe = "src-tauri\target\release\gold-label-studio-pro.exe"
          $appData = Join-Path $env:APPDATA "com.amirnourhan.goldlabelstudiopro"

          # A completely fresh user-data directory is the first-run case a new
          # installation faces on a real Windows machine.
          Remove-Item -Recurse -Force $appData -ErrorAction SilentlyContinue

          $report = Join-Path $env:TEMP "glsp-fresh-self-check.json"
          Remove-Item $report -ErrorAction SilentlyContinue
          $check = Start-Process -FilePath $exe -ArgumentList "--database-self-check=`"$report`"" -PassThru -Wait
          if (Test-Path $report) { Get-Content $report | Write-Host }
          if ($check.ExitCode -ne 0) { throw "The database self check failed with exit code $($check.ExitCode)" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw "The database self check did not pass: $($result.error)" }
          if (-not $result.schema.createdFile) { throw "A fresh user-data directory should have created the database file" }
          if ($result.schema.tablesPresent -ne $result.schema.tablesExpected) {
            throw "Only $($result.schema.tablesPresent) of $($result.schema.tablesExpected) tables exist in the fresh database"
          }
          if (-not $result.insertedUser -or -not $result.userSurvivedReopen -or -not $result.cleanedUp) {
            throw "The first administrator insert path failed in the packaged build"
          }
          $database = Join-Path $appData "gold-label-studio-pro.db"
          if (!(Test-Path $database)) { throw "The application did not create its database in $appData" }

          # Second run: an existing database must be reused, not recreated, so a
          # database written by an earlier build keeps working.
          $again = Join-Path $env:TEMP "glsp-existing-self-check.json"
          Remove-Item $again -ErrorAction SilentlyContinue
          $reuse = Start-Process -FilePath $exe -ArgumentList "--database-self-check=`"$again`"" -PassThru -Wait
          if ($reuse.ExitCode -ne 0) { throw "The database self check failed on an existing database" }
          $existing = Get-Content $again -Raw | ConvertFrom-Json
          if (-not $existing.passed) { throw "The self check failed on an existing database: $($existing.error)" }
          if ($existing.schema.createdFile) { throw "An existing database must be reused instead of recreated" }

      - name: Smoke packaged executable
        shell: powershell
        run: |
          $exe = "src-tauri\target\release\gold-label-studio-pro.exe"
          if (!(Test-Path $exe)) { throw "Executable not found: $exe" }
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) { throw "Gold Label Studio Pro exited during smoke launch" }
          if ($p.MainWindowHandle -eq 0) {
            Start-Sleep -Seconds 4
            $p.Refresh()
          }
          if ($p.MainWindowHandle -eq 0) { throw "Main window handle was not created" }

          # No console window may exist for the application process. A console
          # subsystem build has conhost.exe attached as a child.
          $children = @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" -ErrorAction SilentlyContinue)
          Write-Host "Child processes: $($children.Name -join ', ')"
          if (@($children | Where-Object { $_.Name -eq "conhost.exe" }).Count -gt 0) {
            throw "A console window was created for the packaged application"
          }
          Stop-Process -Id $p.Id -Force

      - name: Install NSIS installer and smoke test the installed app
        shell: powershell
        run: |
          $setup = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer was not produced" }
          if ($setup.Name -ne "Gold Label Studio Pro_0.2.2_x64-setup.exe") {
            throw "Unexpected NSIS artifact name: $($setup.Name)"
          }
          Write-Host "Installing $($setup.FullName)"

          $install = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)" }
          Start-Sleep -Seconds 5

          $installDir = Join-Path $env:LOCALAPPDATA "Gold Label Studio Pro"
          $installed = Get-ChildItem "$installDir\*.exe" | Where-Object { $_.Name -ne "uninstall.exe" } | Select-Object -First 1
          if (-not $installed) { throw "Installed executable not found in $installDir" }
          Write-Host "Installed executable: $($installed.FullName)"

          # Start Menu entry: silent installs create the shortcut directly in Programs,
          # interactive installs create it inside the configured folder.
          $startMenu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs"
          $shortcut = @(Get-ChildItem -Path $startMenu -Recurse -Filter "*.lnk" -ErrorAction SilentlyContinue |
            Where-Object { $_.BaseName -like "Gold Label Studio Pro*" })
          if ($shortcut.Count -eq 0) { throw "Start Menu shortcut was not created under $startMenu" }
          Write-Host "Start Menu shortcut: $($shortcut[0].FullName)"

          $desktopShortcut = Get-Item (Join-Path ([Environment]::GetFolderPath("Desktop")) "Gold Label Studio Pro.lnk") -ErrorAction SilentlyContinue
          if ($desktopShortcut) { Write-Host "Desktop shortcut: $($desktopShortcut.FullName)" }
          else { Write-Host "Desktop shortcut was not created (optional)" }

          # User data sentinel: an uninstall must never destroy the database or backups.
          $appData = Join-Path $env:APPDATA "com.amirnourhan.goldlabelstudiopro"
          New-Item -ItemType Directory -Force -Path $appData | Out-Null
          $sentinel = Join-Path $appData "ci-user-data-sentinel.txt"
          Set-Content -Path $sentinel -Value "keep me"

          # The installed build must open the real database and store a first
          # administrator, which is exactly what failed on a physical machine.
          $report = Join-Path $env:TEMP "glsp-installed-self-check.json"
          Remove-Item $report -ErrorAction SilentlyContinue
          $check = Start-Process -FilePath $installed.FullName -ArgumentList "--database-self-check=`"$report`"" -PassThru -Wait
          if (Test-Path $report) { Get-Content $report | Write-Host }
          if ($check.ExitCode -ne 0) { throw "The installed database self check failed with exit code $($check.ExitCode)" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw "The installed database self check did not pass: $($result.error)" }
          if ($result.schema.tablesPresent -ne $result.schema.tablesExpected) {
            throw "The installed database is missing tables: $($result.schema.tablesPresent)/$($result.schema.tablesExpected)"
          }
          if (-not $result.insertedUser -or -not $result.userSurvivedReopen -or -not $result.cleanedUp) {
            throw "The installed build could not store and reload a user row"
          }

          $database = Join-Path $appData "gold-label-studio-pro.db"
          if (!(Test-Path $database)) { throw "The installed application did not create its database in $appData" }
          Write-Host "Installed application prepared its database at $database"

          $acceptanceMarker = Join-Path $env:TEMP "glsp-acceptance-v0.2.2.json"
          Remove-Item $acceptanceMarker -ErrorAction SilentlyContinue

          function Wait-ForAcceptanceReport(
            [System.Diagnostics.Process]$Process,
            [string]$ExpectedPhase,
            [int]$Seconds = 60
          ) {
            $lastPhase = "none"
            for ($i = 0; $i -lt ($Seconds * 4); $i++) {
              if (Test-Path $acceptanceMarker) {
                try { $result = Get-Content $acceptanceMarker -Raw | ConvertFrom-Json }
                catch { $result = $null }
                if ($result -and $result.marker -ne "GLSP_ACCEPTANCE_HARNESS_V1") {
                  throw "Installed application wrote an invalid acceptance marker"
                }
                if ($result -and $result.phase -eq "failed") {
                  throw "Internal acceptance failed at $($result.step): $($result.message)"
                }
                if ($result -and $result.phase -ne $lastPhase) {
                  $lastPhase = $result.phase
                  Write-Host "Acceptance phase: $lastPhase"
                }
                if ($result -and $result.phase -eq $ExpectedPhase) {
                  $null = $Process.WaitForExit(10000)
                  $Process.Refresh()
                  if (-not $Process.HasExited) {
                    throw "Installed application did not close normally after $ExpectedPhase"
                  }
                  return $result
                }
              }
              $Process.Refresh()
              if ($Process.HasExited) {
                throw "Installed application exited before reporting $ExpectedPhase"
              }
              Start-Sleep -Milliseconds 250
            }
            throw "Timed out waiting for installed application phase $ExpectedPhase; last reported phase: $lastPhase"
          }

          function Assert-AuthBounds($Bounds, [string]$Label) {
            if ($Bounds.width -ge 900) { throw "$Label was not compact: $($Bounds.width)x$($Bounds.height)" }
          }

          function Assert-WorkspaceBounds($Bounds, [string]$Label) {
            if ($Bounds.width -lt 1000) { throw "$Label did not reach workspace mode: $($Bounds.width)x$($Bounds.height)" }
          }

          # The acceptance-only React driver calls the exact AuthSession methods
          # used by LoginPage. Those methods retain the production path through
          # UserService, UserRepository, tauri-plugin-sql, hashing, and SQLite.
          $acceptanceArgument = "--acceptance-report=`"$acceptanceMarker`""
          $app = Start-Process -FilePath $installed.FullName -ArgumentList $acceptanceArgument -PassThru
          Start-Sleep -Milliseconds 500
          $children = @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$($app.Id)" -ErrorAction SilentlyContinue)
          Write-Host "Installed child processes: $($children.Name -join ', ')"
          if (@($children | Where-Object { $_.Name -eq "conhost.exe" }).Count -gt 0) {
            throw "The installed application created a console window"
          }

          $firstRun = Wait-ForAcceptanceReport $app "first-run-complete"
          $firstRun | ConvertTo-Json -Depth 5 | Write-Host
          Assert-AuthBounds $firstRun.initialAuth "First Run"
          Assert-WorkspaceBounds $firstRun.firstWorkspace "First-admin authentication"
          Assert-AuthBounds $firstRun.signedOutAuth "Signed-out Login"
          Assert-WorkspaceBounds $firstRun.reauthenticatedWorkspace "Same-run reauthentication"

          # Relaunch proves the hashed administrator survived a process restart
          # and can be authenticated again through the production session path.
          $relaunch = Start-Process -FilePath $installed.FullName -ArgumentList $acceptanceArgument -PassThru
          $restart = Wait-ForAcceptanceReport $relaunch "restart-complete"
          $restart | ConvertTo-Json -Depth 5 | Write-Host
          Assert-AuthBounds $restart.initialAuth "Restart Login"
          Assert-WorkspaceBounds $restart.restartedWorkspace "Restart authentication"

          $uninstaller = Join-Path $installDir "uninstall.exe"
          if (!(Test-Path $uninstaller)) { throw "Uninstaller not found: $uninstaller" }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 5

          if (Test-Path $installed.FullName) { throw "Uninstall left the application binary behind" }
          Write-Host "Uninstall removed the application"

          if (!(Test-Path $sentinel)) { throw "Uninstall destroyed user data in $appData" }
          Write-Host "User data survived the uninstall"

      # Rebuild without the Rust feature or Vite flag. This is the only NSIS
      # installer uploaded for users; the temporary acceptance build is replaced.
      - name: Tauri final Windows release build + NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Assert the final NSIS installer
        shell: powershell
        run: |
          $setup = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (-not $setup) { throw "Final NSIS installer was not produced" }
          if ($setup.Name -ne "Gold Label Studio Pro_0.2.2_x64-setup.exe") {
            throw "Unexpected final NSIS artifact name: $($setup.Name)"
          }

          $exe = "src-tauri\target\release\gold-label-studio-pro.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [System.BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($subsystem -ne 2) { throw "Final production executable subsystem is $subsystem, expected Windows GUI (2)" }

          $forbidden = @(
            "GLSP_ACCEPTANCE_HARNESS_V1",
            "GLSP-CI-Only-1405!",
            "acceptance_get_config",
            "acceptance_read_report",
            "acceptance_write_report"
          )
          $frontend = (Get-ChildItem "dist\assets\*.js" | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          $binary = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($token in $forbidden) {
            if ($frontend.Contains($token)) { throw "Final frontend still contains acceptance token: $token" }
            if ($binary.Contains($token)) { throw "Final executable still contains acceptance token: $token" }
          }
          Write-Host "Final production installer: $($setup.FullName)"
          Write-Host "Final production executable has no acceptance markers or commands"

      - name: Install final NSIS and smoke test the production app
        shell: powershell
        run: |
          $setup = Get-Item "src-tauri\target\release\bundle\nsis\Gold Label Studio Pro_0.2.2_x64-setup.exe"
          $install = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Final installer exited with code $($install.ExitCode)" }
          Start-Sleep -Seconds 5

          $installDir = Join-Path $env:LOCALAPPDATA "Gold Label Studio Pro"
          $installed = Get-ChildItem "$installDir\*.exe" | Where-Object { $_.Name -ne "uninstall.exe" } | Select-Object -First 1
          if (-not $installed) { throw "Final installed executable was not found" }

          $app = Start-Process -FilePath $installed.FullName -PassThru
          Start-Sleep -Seconds 6
          $app.Refresh()
          if ($app.HasExited) { throw "Final installed application exited during smoke launch" }
          if ($app.MainWindowHandle -eq 0) {
            Start-Sleep -Seconds 4
            $app.Refresh()
          }
          if ($app.MainWindowHandle -eq 0) { throw "Final installed application did not create a window" }
          $children = @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$($app.Id)" -ErrorAction SilentlyContinue)
          if (@($children | Where-Object { $_.Name -eq "conhost.exe" }).Count -gt 0) {
            throw "Final installed application created a console window"
          }
          Stop-Process -Id $app.Id -Force

          $uninstaller = Join-Path $installDir "uninstall.exe"
          if (!(Test-Path $uninstaller)) { throw "Final uninstaller was not found" }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Final uninstaller exited with code $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 5
          if (Test-Path $installed.FullName) { throw "Final uninstall left the application binary behind" }

          $sentinel = Join-Path (Join-Path $env:APPDATA "com.amirnourhan.goldlabelstudiopro") "ci-user-data-sentinel.txt"
          if (!(Test-Path $sentinel)) { throw "Final uninstall destroyed user data" }
          Write-Host "Final installed application launched normally and user data survived uninstall"

      - name: Tauri MSI installer (secondary artifact)
        run: npm run tauri build -- --bundles msi

      - name: Upload Windows MSI installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Gold-Label-Studio-Pro-Windows-Setup-MSI
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Upload Windows NSIS installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Gold-Label-Studio-Pro-Windows-Setup-NSIS
          path: src-tauri/target/release/bundle/nsis/Gold Label Studio Pro_0.2.2_x64-setup.exe

      - name: Upload installed-app diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gold-Label-Studio-Pro-0.2.2-Diagnostics
          path: |
            ${{ runner.temp }}/glsp-*-self-check.json
            ${{ runner.temp }}/glsp-acceptance-*.json
            ${{ env.LOCALAPPDATA }}/com.amirnourhan.goldlabelstudiopro/logs/*.jsonl
          if-no-files-found: ignore

      - name: Upload Windows preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Gold-Label-Studio-Pro-React-Tauri-Preview
          path: src-tauri/target/release/gold-label-studio-pro.exe
