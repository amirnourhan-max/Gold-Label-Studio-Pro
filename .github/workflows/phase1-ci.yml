name: Phase 1 CI

on:
  push:
    branches: [main, phase-1-foundation]
  pull_request:
    branches: [main]

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v
      - name: Ruff
        run: python -m ruff check src tests tools launcher.py
      - name: Compile
        run: python -m compileall -q src tools launcher.py
      - name: Source smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m gold_label_studio --smoke-test
      - name: Capture dashboard
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/capture_ui.py
      - name: Upload dashboard screenshot
        uses: actions/upload-artifact@v4
        with:
          name: phase1-dashboard
          path: artifacts/phase1-dashboard.png
      - name: Build Windows application
        run: python -m nuitka --standalone --enable-plugin=pyside6 --windows-console-mode=disable --assume-yes-for-downloads --output-filename=GoldLabelStudioPro.exe --output-dir=dist launcher.py
      - name: Verify built executable
        run: .\dist\launcher.dist\GoldLabelStudioPro.exe --smoke-test
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Gold-Label-Studio-Pro-Phase1-Windows
          path: dist/launcher.dist/
